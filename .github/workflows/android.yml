name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TubePulse.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TubePulse-apk
          path: TubePulse.apk
          if-no-files-found: error

      - name: Publish "latest" prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TubePulse latest
          prerelease: true
          make_latest: false
          files: TubePulse.apk
